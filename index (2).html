<style>
:root{--bg:#f6f8f7;--surface:#fff;--ink:#0e1a14;--mute:#556a60;--line:#dbe4df;--accent:#0b7a55;--warm:#8a6210;--on:#fff;--sh:transparent;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f0d;--surface:#111815;--ink:#e8f0eb;--mute:#8fa39a;--line:#22302a;--accent:#34d399;--warm:#e0b25a;--on:#04140a;--sh:transparent}}
:root[data-theme="dark"]{--bg:#0b0f0d;--surface:#111815;--ink:#e8f0eb;--mute:#8fa39a;--line:#22302a;--accent:#34d399;--warm:#e0b25a;--on:#04140a;--sh:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.75;font-size:17px;}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-weight:700;letter-spacing:.2px}
nav{display:flex;gap:18px;font-size:15px;color:var(--mute)}
nav a{text-decoration:none}nav a:hover{color:var(--ink)}
.tools{display:flex;gap:8px}
button{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}

.hero{padding:72px 0 56px}
.hero h1{font-size:clamp(34px,6.5vw,58px);line-height:1.2;margin:0 0 14px;font-weight:800}
.hero p.lead{font-size:clamp(18px,2.6vw,22px);color:var(--mute);max-width:34em;margin:0 0 30px}
.flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:8px 0 34px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
.node.ai{border-color:var(--accent);color:var(--accent)}
.wire{width:44px;height:2px;background:repeating-linear-gradient(90deg,var(--warm) 0 6px,transparent 6px 12px);background-size:24px 2px;animation:run 1.2s linear infinite}
@keyframes run{to{background-position:24px 0}}
@media (prefers-reduced-motion:reduce){.wire{animation:none}}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta a{padding:11px 22px;border-radius:12px;text-decoration:none;font-weight:600}
.cta .p{background:var(--accent);color:var(--on)}
.cta .s{border:1px solid var(--line)}
section{padding:54px 0;border-top:1px solid var(--line)}
h2{font-size:28px;margin:0 0 22px}
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:34px}
.about p{margin:0 0 14px;color:var(--mute)}
.facts{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.facts li{padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.facts li:last-child{border:0}
.facts b{display:block;color:var(--mute);font-weight:400;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:15px}
.note{color:var(--mute);font-size:15px;margin-top:16px}
.tl{border-inline-start:2px solid var(--accent);padding-inline-start:22px}
.tl h3{margin:0 0 4px;font-size:20px}.tl p{margin:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px}
.card h3{margin:0 0 8px;font-size:18px}.card p{margin:0 0 12px;color:var(--mute);font-size:15px}
.tag{display:inline-block;font-size:13px;color:var(--warm);border:1px solid var(--warm);border-radius:6px;padding:1px 10px}
.contact a{display:inline-block;margin:0 0 10px;font-size:20px;text-decoration:none;border-bottom:2px solid var(--accent)}
.cgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:34px}
form label{display:block;margin-bottom:14px;font-size:15px;color:var(--mute)}
form input:not([type=hidden]):not([type=checkbox]),textarea{display:block;width:100%;margin-top:6px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.send{background:var(--accent);color:var(--on);border:0;padding:11px 26px;font-weight:600;border-radius:12px}
.direct{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.direct a{font-size:18px;text-decoration:none;border-bottom:2px solid var(--accent)}
.direct .dl{margin-top:14px;border:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 20px;border-radius:12px;font-weight:600}
@media (max-width:720px){.cgrid{grid-template-columns:1fr}}
.card.solid{border-style:solid}
.node,.card,.card.solid,.facts{border:1px solid var(--line);background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.1)}
h2{font-weight:600}
.hero h1{font-weight:700;letter-spacing:-.3px}
.chips span{border:1px solid var(--line);border-radius:999px;font-weight:500}

button{border:1px solid var(--line)}
header{border-bottom:1px solid var(--line)}
.tl{border-inline-start:2px solid var(--accent)}
.tag{background:transparent;color:var(--warm);border:1px solid var(--warm);border-radius:999px;padding:1px 12px}
footer{padding:28px 0 40px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
@media (max-width:720px){nav{display:none}.about{grid-template-columns:1fr}.hero{padding-top:44px}}
</style>
</head>

<script>
(function(){
var root=document.documentElement,lang="ar";
function apply(){
root.lang=lang;root.dir=lang==="ar"?"rtl":"ltr";
document.querySelectorAll("[data-ar]").forEach(function(e){e.textContent=e.getAttribute("data-"+lang)});
document.getElementById("lang").textContent=lang==="ar"?"EN":"AR";
}
document.getElementById("lang").onclick=function(){lang=lang==="ar"?"en":"ar";apply()};
document.getElementById("theme").onclick=function(){
var dark=root.getAttribute("data-theme")==="dark"||(!root.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);
root.setAttribute("data-theme",dark?"light":"dark");
};
root.setAttribute("data-theme","dark");
apply();
})();
